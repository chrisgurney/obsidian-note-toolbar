# credentials come from env vars, never commit them
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
preserve_hierarchy: true

files:
  # main UI strings
  - source: /src/I18n/en.json
    translation: /src/I18n/%locale%.json
    type: i18next_json
    skip_untranslated_strings: true
    languages_mapping:
      locale:
        en: en
        de: de
        ja: ja
        uk: uk
        zh-CN: zh-CN
  # CLI strings
  - source: /src/I18n/cli/en.json
    translation: /src/I18n/cli/%locale%.json
    type: i18next_json
    skip_untranslated_strings: true
    languages_mapping:
      locale:
        en: en
        de: de
        ja: ja
        uk: uk
        zh-CN: zh-CN
  # Gallery strings
  - source: /src/I18n/gallery/en.json
    translation: /src/I18n/gallery/%locale%.json
    type: i18next_json
    skip_untranslated_strings: true
    languages_mapping:
      locale:
        en: en
        de: de
        ja: ja
        uk: uk
        zh-CN: zh-CN